name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Build the same Ubuntu 24.04 + ROS 2 Jazzy image used for local
      # development (docker/Dockerfile), so CI matches the dev container
      # exactly rather than drifting against a separately-maintained image.
      - name: Build dev container image
        run: |
          docker build \
            --build-arg USER_UID=1000 \
            --build-arg USER_GID=1000 \
            --build-arg USERNAME=ci \
            -t archangel-dev:ci \
            -f docker/Dockerfile \
            docker

      - name: Run flake8 (Python linting)
        run: |
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}":/home/ci/ws/src \
            -w /home/ci/ws/src \
            archangel-dev:ci \
            bash -c "flake8 ros2_ws/src --max-line-length=99"

      - name: colcon build (smoke test)
        run: |
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}":/home/ci/ws/src \
            -w /home/ci/ws/src/ros2_ws \
            archangel-dev:ci \
            bash -c "source /opt/ros/jazzy/setup.bash && colcon build"
